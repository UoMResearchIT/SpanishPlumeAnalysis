
# This compose file runs the tests for the wrf-analysis-toolkit and exits when done.
# To run the tests, cd into tests/ and execute either:
#   docker compose up --build pytest-coverage
# or
#   docker compose up --build human-checks
#

name: wrf-analysis
services:
  pytest-coverage:
    ## This service runs pytest within coverage, which generates a report.
    ## You may then explore the results in /htmlcov/class_index.html.
    ## To only run this service and inspect the results, execute:
    ## ```
    ## docker compose up --build pytest-coverage
    ## xdg-open $(docker volume inspect wrf-analysis_memory -f '{{ .Mountpoint }}')/htmlcov/class_index.html
    ## ```
    image: wrf-analysis:testing
    build:
      context: ../
      dockerfile: tests/Dockerfile
    container_name: wrf-analysis-pytest-coverage
    volumes:
      - memory:/memory  # Used to persist pytest cache between runs
      - $WRF_DATA_PATH:/wrfdata:ro
    command: >-
      bash -c "coverage erase &&
      coverage run -m pytest -s -vv tests/ --ignore=tests/human_checks &&
      coverage combine &&
      coverage report &&
      coverage html -d /memory/htmlcov"

  human-checks:
    ## This service runs the human checks tests, which generate a set of plots for manual inspection.
    ## You may then explore the results in the /memory/human_checks_results directory.
    ## To only run this service and inspect the results, execute:
    ## ```
    ## docker compose up --build human-checks
    ## xdg-open $(docker volume inspect wrf-analysis_memory -f '{{ .Mountpoint }}')/human_checks_results
    ## ```
    image: wrf-analysis:testing
    tty: true
    stdin_open: true
    build:
      context: ../
      dockerfile: tests/Dockerfile
    container_name: wrf-analysis-human-checks
    volumes:
      - memory:/memory  # Used to persist pytest cache between runs
      - $WRF_DATA_PATH:/wrfdata:ro
    environment:
      - PYTHONUNBUFFERED=1
      - RESULTS_PATH=/memory/human_checks_results # Human checks tests save outputs here for inspection
    command: >-
      bash -c "
        rm -rf /memory/human_checks_results/* &&
        python -u tests/human_checks/single_image_all_diags_test.py &&
        python -u tests/human_checks/test.py
      "

volumes:
  memory:
